<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Notre-Dame Burial Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <h1>Notre-Dame Burial Map</h1>

  <div id="controls">
    <input id="searchInput" type="text" placeholder="Search sample ID or stipulated name..." />

    <button id="clearSearch">Clear</button>

    <label for="colorMode">Color by:</label>

    <select id="colorMode">
      <option value="MT_haplogroup">MT haplogroup</option>
      <option value="Sex">Sex</option>
      <option value="Kinship_group">Kinship group</option>
    </select>
  </div>

  <div id="map"></div>

  <div id="legendPanel">
    <h3>Legend / Filters</h3>
    <div id="legendContent"></div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="app.js?v=5"></script>

</body>
</html>
